# Blueprint для render.com — «Infrastructure as Code».
#
# Как пользоваться: залить репозиторий на GitHub, затем на Render
# New → Blueprint → выбрать репозиторий → Apply.
# Render сам создаст и веб-сервис, и базу Postgres, и свяжет их.
#
# Переменные с sync: false Render спросит при создании — это секреты,
# их нельзя держать в репозитории.

services:
  - type: web
    name: sprice-private
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production

      # Секрет для подписи кодов подтверждения. Render сгенерирует сам.
      - key: CODE_PEPPER
        generateValue: true

      # База подключается автоматически — руками ничего копировать не надо.
      - key: DATABASE_URL
        fromDatabase:
          name: sprice-db
          property: connectionString

      # Адрес сайта подставляется в письма. Подставь свой после первого деплоя,
      # если имя сервиса окажется занято и Render добавит суффикс к домену.
      - key: SITE_URL
        value: https://sprice-private.onrender.com

      # Адрес отправителя. Если оставить пустым — подставится SMTP_USER,
      # что для Gmail и нужно: From обязан совпадать с логином.
      - key: MAIL_FROM
        sync: false

      # ─── Почта: заполнить ОДИН из вариантов в панели Render ───
      # Вариант 1 — Resend: просто вставь ключ.
      - key: RESEND_API_KEY
        sync: false

      # Вариант 2 — Gmail. Хост и порт уже заданы, вставь только
      # SMTP_USER (адрес целиком, вида name@gmail.com) и SMTP_PASS —
      # это «пароль приложения» из 16 символов, НЕ обычный пароль от аккаунта.
      # Получить: https://myaccount.google.com/apppasswords (нужна включённая 2FA)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # ─── Коды и сессии ───
      - key: CODE_TTL_MINUTES
        value: 10
      - key: CODE_MAX_ATTEMPTS
        value: 5
      - key: RESEND_COOLDOWN_SEC
        value: 60
      - key: RESEND_MAX_PER_HOUR
        value: 5

      - key: FUNPAY_URL
        value: https://funpay.com/users/16370618/

databases:
  - name: sprice-db
    plan: free
    databaseName: sprice
    user: sprice
